name: release-iso
on:
  push:
    paths:
      - "boot_menu.yml"
      - ".github/workflows/release-iso.yml"
  workflow_dispatch:

concurrency:
  group: release-iso-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare auto-iso Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Ensure auto-iso release exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if ! gh release view auto-iso -R "${OWNER}/${REPO}" >/dev/null 2>&1; then
            gh release create auto-iso -t ISO -n "This is an automatically generated ISO release." -R "${OWNER}/${REPO}"
          fi

  build-iso:
    name: Build ISO for ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: prepare-release
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: my-ublue
            fedora_version: 44
          - image: my-ublue-silverblue
            fedora_version: 44
          - image: my-ublue-cosmic
            fedora_version: 42
          - image: my-ublue-sway-atomic
            fedora_version: 42
    steps:
      - uses: actions/checkout@v7

      - name: Build ISO
        uses: jasonn3/build-container-installer@v1.5.0
        id: build
        with:
          arch: x86_64
          image_name: ${{ matrix.image }}
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: latest
          version: ${{ matrix.fedora_version }}
          # Kinoite variant required for user creation options in anaconda.
          # Silverblue variant omits them, see ublue-os/cosmic build_iso.yml
          variant: Kinoite
          iso_name: ${{ matrix.image }}-${{ matrix.fedora_version }}.iso

      - name: Upload ISO and Checksum
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          ISO_DIR="${{ steps.build.outputs.iso_path }}"
          ISO="${{ steps.build.outputs.iso_name }}"
          gh release upload auto-iso "${ISO_DIR}/${ISO}" -R "${OWNER}/${REPO}" --clobber
          gh release upload auto-iso "${ISO_DIR}/${ISO}-CHECKSUM" -R "${OWNER}/${REPO}" --clobber
